<script>
(async () => {
  const s = await fetch("/api/site-settings")
    .then(r => r.json())
    .catch(() => ({}));

  if (s.support_whatsapp) {
    document.getElementById("waText").textContent =
      "WhatsApp: " + s.support_whatsapp;
  }
})();

document.getElementById("supportForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const msg = document.getElementById("msg");
  msg.textContent = "Sending...";

  const payload = {
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    subject: document.getElementById("subject").value.trim(),
    message: document.getElementById("message").value.trim()
  };

  try {
    const r = await fetch("/api/support", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    const data = await r.json();

    if (!r.ok) {
      msg.textContent = data.error || "Message could not be sent.";
      return;
    }

    msg.textContent = data.message || "Message sent successfully.";
    document.getElementById("supportForm").reset();

  } catch (err) {
    msg.textContent = "Something went wrong. Please try again.";
  }
});
</script>
