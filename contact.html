<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact World TV</title>

  <style>
    body{
      margin:0;
      font-family:system-ui,sans-serif;
      background:#fff9eb;
      color:#17130a;
    }

    .box{
      width:min(850px,92%);
      margin:45px auto;
      background:#fff;
      border:1px solid #eadfc8;
      border-radius:22px;
      padding:35px;
    }

    .logo{
      width:160px;
      display:block;
      margin:0 auto 25px;
    }

    .item{
      background:#fff6d7;
      padding:20px;
      border-radius:15px;
      margin-bottom:25px;
    }

    label{
      display:block;
      font-weight:700;
      margin-top:14px;
    }

    input,textarea{
      width:100%;
      box-sizing:border-box;
      padding:14px;
      margin-top:7px;
      border:1px solid #d8ccb2;
      border-radius:10px;
      font-size:16px;
    }

    textarea{
      min-height:150px;
    }

    .btn{
      display:inline-block;
      background:#e0a200;
      color:#17130a;
      border:0;
      border-radius:12px;
      padding:14px 20px;
      font-weight:800;
      margin-top:18px;
      text-decoration:none;
      cursor:pointer;
    }

    .muted{
      color:#716958;
    }
  </style>
</head>

<body>

<div class="box">

  <img class="logo" src="/world-tv-logo.png" alt="World TV">

  <h1>Contact World TV</h1>
<div class="item">
  <h3>Subscription / Inquiries</h3>

  <a href="https://wa.me/15309040310"
     target="_blank"
     rel="noopener"
     style="
       display:inline-flex;
       align-items:center;
       gap:8px;
       background:#25D366;
       color:white;
       padding:11px 16px;
       border-radius:10px;
       text-decoration:none;
       font-weight:800;
     ">

    <svg width="24" height="24" viewBox="0 0 32 32"
         fill="currentColor" aria-hidden="true">
      <path d="M16 3a12.9 12.9 0 0 0-11 19.7L3 29l6.5-2A13 13 0 1 0 16 3zm0 23.5a10.5 10.5 0 0 1-5.4-1.5l-.4-.2-3.9 1.2 1.3-3.8-.3-.4A10.5 10.5 0 1 1 16 26.5zm5.8-7.8c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-.9 1.2-.2.2-.3.2-.7.1-1.8-.9-3-1.6-4.2-3.6-.3-.5.3-.5.9-1.7.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 3s1.3 3.5 1.5 3.7c.2.2 2.5 3.8 6.1 5.3 2.3 1 3.2 1.1 4.4.9.7-.1 1.9-.8 2.2-1.5.3-.7.3-1.4.2-1.5-.2-.2-.4-.3-.7-.5z"/>
    </svg>

    WhatsApp +1 (530) 904-0310
  </a>
</div>  

  <h2>Send us a message</h2>

  <form id="supportForm">

    <label>Name</label>
    <input id="name" required>

    <label>Email</label>
    <input id="email" type="email">

    <label>Phone / WhatsApp</label>
    <input id="phone">

    <label>Subject</label>
    <input id="subject" required>

    <label>Message</label>
    <textarea id="message" required></textarea>

    <button class="btn" type="submit">Send Message</button>

  </form>

  <p id="msg" class="muted"></p>

  <a class="btn" href="/">Back to Home</a>

</div>

<script>








  
document.getElementById("supportForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const msg = document.getElementById("msg");
  msg.textContent = "Sending...";

  const payload = {
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    subject: document.getElementById("subject").value.trim(),
    message: document.getElementById("message").value.trim()
  };

  try {
    const r = await fetch("/api/support", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    const data = await r.json();

    if (!r.ok) {
      msg.textContent = data.error || "Message could not be sent.";
      return;
    }

    msg.textContent = data.message || "Message sent successfully.";
    document.getElementById("supportForm").reset();

  } catch (err) {
    msg.textContent = "Something went wrong. Please try again.";
  }
});
</script>

</body>
</html>
