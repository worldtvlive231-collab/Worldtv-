<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create World TV Account</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#fff9eb;margin:0}.box{width:min(460px,92%);margin:60px auto;background:#fff;padding:28px;border-radius:20px;border:1px solid #eadfc8}.logo{width:125px;display:block;margin:auto}input{width:100%;box-sizing:border-box;padding:13px;margin:6px 0 14px;border:1px solid #d8ccb2;border-radius:10px}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#e0a200;font-weight:800}.muted{color:#716958}.ref-note{background:#fff5d6;border:1px solid #ead7a0;padding:10px 12px;border-radius:10px;margin:0 0 12px;display:none}
  </style>
  <script src="/assets/site-meta.js"></script>
</head>
<body>
  <div class="box">
    <img class="logo" src="/world-tv-logo.png" alt="World TV">
    <h2>Create Account</h2>
    <div id="refNote" class="ref-note">Referral link detected. Your referral code has been added automatically.</div>
    <form id="f">
      <label>Full name</label><input id="name" required>
      <label>Email</label><input id="email" type="email" required>
      <label>Password</label><input id="password" type="password" minlength="8" required>
      <label>Referral Code <span class="muted">(optional)</span></label><input id="referral_code" placeholder="WTV..." autocomplete="off"><p id="referralStatus" class="muted" style="margin-top:-8px"></p>
      <button class="btn" type="submit">Create Account</button>
    </form>
    <p id="msg" class="muted"></p>
    <p class="muted">Already registered? <a href="/login.html">Login</a></p>
  </div>
<script>
const form=document.getElementById("f");
function showReferralNotice(){const a=window.WorldTVMarketing?.getAttribution?.();const input=document.getElementById('referral_code');if(a?.referral_code&&input){input.value=a.referral_code;document.getElementById('refNote').style.display='block'}}
async function validateReferral(){const input=document.getElementById('referral_code'),status=document.getElementById('referralStatus'),code=input.value.trim().toUpperCase();input.value=code;if(!code){status.textContent='';return true;}status.textContent='Checking referral code...';try{const response=await fetch(`/api/referrals/validate?code=${encodeURIComponent(code)}`,{cache:'no-store'}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Referral code is invalid');status.style.color='#176b3a';status.textContent=`✓ Valid referral from ${data.referrer_name||'a WORLD TV customer'}`;return true}catch(error){status.style.color='#a12626';status.textContent=error.message;return false}}
document.getElementById('referral_code').addEventListener('blur',validateReferral);
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',showReferralNotice);else showReferralNotice();
form.addEventListener("submit",async(e)=>{
  e.preventDefault();const msg=document.getElementById("msg");if(!await validateReferral()){msg.textContent="Please correct or remove the referral code.";return}msg.textContent="Creating account...";
  try{
    const response=await fetch("/api/customer/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("name").value,email:document.getElementById("email").value,password:document.getElementById("password").value,referral_code:document.getElementById("referral_code").value})});
    const data=await response.json();if(!response.ok){msg.textContent=data.error||"Could not create account.";return}
    localStorage.setItem("wtv_customer_token",data.token);
    try{await window.WorldTVMarketing?.bindCustomer?.(data.token)}catch(_){}
    window.location.href="/account.html";
  }catch(error){msg.textContent="Something went wrong. Please try again."}
});
</script>
<script src="/assets/language-selector.js?v=1"></script>
</body>
</html>
