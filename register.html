<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create WORLD TV Account</title><meta name="robots" content="noindex,nofollow"><style>:root{--bg:#090909;--panel:#141414;--line:#2c2412;--gold:#f1bd3b;--muted:#aaa;--ok:#7fd29a;--bad:#ff9c9c}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 0,#322100 0,#111 34%,#090909 72%);color:#fff;margin:0;min-height:100vh}.box{width:min(480px,92%);margin:42px auto;background:rgba(20,20,20,.97);padding:30px;border-radius:22px;border:1px solid var(--line);box-shadow:0 24px 70px #0008}.logo{width:138px;display:block;margin:0 auto 18px}h1{margin:0 0 8px;text-align:center}.intro{text-align:center;color:var(--muted);margin:0 0 22px;line-height:1.5}label{font-size:13px;font-weight:800}input{width:100%;padding:13px;margin:6px 0 15px;border:1px solid #40371f;border-radius:10px;background:#0d0d0d;color:#fff;font-size:16px}.btn{width:100%;padding:14px;border:0;border-radius:11px;background:linear-gradient(135deg,#ffd764,#c88b00);color:#17110a;font-weight:900;font-size:16px;cursor:pointer}.btn:disabled{opacity:.6}.muted{color:var(--muted)}a{color:var(--gold)}.ref-note{background:#241d0d;border:1px solid #5c4716;padding:11px 12px;border-radius:10px;margin:0 0 14px;display:none;color:#f6d978}.links{text-align:center;margin-top:18px;line-height:1.7}#msg,#referralStatus{min-height:18px}</style><link rel="icon" href="/world-tv-logo.png"><script src="/assets/site-meta.js"></script></head><body><main class="box"><a href="/"><img class="logo" src="/world-tv-logo.png" alt="WORLD TV"></a><h1>Create Your Account</h1><p class="intro">Use one WORLD TV account for subscription payments, activation codes and account history.</p><div id="refNote" class="ref-note">Referral link detected. Your referral code has been added automatically.</div><form id="f"><label for="name">Full name</label><input id="name" autocomplete="name" required><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="referral_code">Referral Code <span class="muted">(optional)</span></label><input id="referral_code" placeholder="WTV..." autocomplete="off"><p id="referralStatus" class="muted"></p><button class="btn" id="registerBtn" type="submit">Create Account</button></form><p id="msg" class="muted" role="status"></p><p class="links muted">Already registered? <a id="loginLink" href="/login.html">Login</a><br><a href="/">Back to Home</a></p></main><script>const params=new URLSearchParams(location.search);const requested=params.get('next')||'';const next=requested.startsWith('/')&&!requested.startsWith('//')?requested:'';const referralFromUrl=(params.get('ref')||params.get('referral')||'').trim().toUpperCase();const referralInput=document.getElementById('referral_code');if(referralFromUrl){referralInput.value=referralFromUrl;document.getElementById('refNote').style.display='block'}const loginLink=document.getElementById('loginLink');if(next)loginLink.href='/login.html?next='+encodeURIComponent(next);async function validateReferral(){const status=document.getElementById('referralStatus'),code=referralInput.value.trim().toUpperCase();referralInput.value=code;if(!code){status.textContent='';return true}status.style.color='var(--muted)';status.textContent='Checking referral code...';try{const response=await fetch('/api/referrals/validate?code='+encodeURIComponent(code),{cache:'no-store'});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Referral code is invalid');status.style.color='var(--ok)';status.textContent='✓ Valid referral from '+(data.referrer_name||'a WORLD TV customer');return true}catch(error){status.style.color='var(--bad)';status.textContent=error.message;return false}}referralInput.addEventListener('blur',validateReferral);document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg'),btn=document.getElementById('registerBtn');if(!await validateReferral()){msg.textContent='Please correct or remove the referral code.';return}btn.disabled=true;msg.textContent='Creating account...';try{const response=await fetch('/api/customer/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,email:document.getElementById('email').value,password:document.getElementById('password').value,referral_code:referralInput.value})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Could not create account.');if(!data.token)throw new Error('Account created but automatic login failed.');localStorage.setItem('wtv_customer_token',data.token);try{await window.WorldTVMarketing?.bindCustomer?.(data.token)}catch(_){}location.href=next||'/account.html'}catch(error){msg.textContent=error.message||'Something went wrong. Please try again.';btn.disabled=false}});</script><script src="/assets/language-selector.js?v=1"></script></body></html>
