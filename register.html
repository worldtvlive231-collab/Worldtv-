<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create World TV Account</title>

  <style>
    body{
      font-family:system-ui,sans-serif;
      background:#fff9eb;
      margin:0
    }
    .box{
      width:min(460px,92%);
      margin:60px auto;
      background:#fff;
      padding:28px;
      border-radius:20px;
      border:1px solid #eadfc8
    }
    .logo{
      width:125px;
      display:block;
      margin:auto
    }
    input{
      width:100%;
      box-sizing:border-box;
      padding:13px;
      margin:6px 0 14px;
      border:1px solid #d8ccb2;
      border-radius:10px
    }
    .btn{
      width:100%;
      padding:13px;
      border:0;
      border-radius:10px;
      background:#e0a200;
      font-weight:800
    }
    .muted{color:#716958}
  </style>
</head>

<body>
  <div class="box">

    <img class="logo" src="/world-tv-logo.png" alt="World TV">

    <h2>Create Account</h2>

    <form id="f">
      <label>Full name</label>
      <input id="name" required>

      <label>Email</label>
      <input id="email" type="email" required>

      <label>Password</label>
      <input id="password" type="password" minlength="8" required>

      <label>Referral Code <span class="muted">(optional)</span></label>
      <input id="referral_code" placeholder="WTV...">

      <button class="btn" type="submit">Create Account</button>
    </form>

    <p id="msg" class="muted"></p>

    <p class="muted">
      Already registered?
      <a href="/login.html">Login</a>
    </p>

  </div>

<script>
const form = document.getElementById("f");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const msg = document.getElementById("msg");
  msg.textContent = "Creating account...";

  try {
    const response = await fetch("/api/customer/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
        referral_code: document.getElementById("referral_code").value
      })
    });

    const data = await response.json();

    if (!response.ok) {
      msg.textContent = data.error || "Could not create account.";
      return;
    }

    localStorage.setItem("wtv_customer_token", data.token);
    window.location.href = "/account.html";

  } catch (error) {
    msg.textContent = "Something went wrong. Please try again.";
  }
});
</script>

</body>
</html>
