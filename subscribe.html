<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subscribe — World TV</title>
<style>body{margin:0;font-family:system-ui;background:#fff9eb;color:#17130a}.box{width:min(650px,92%);margin:50px auto;background:#fff;border:1px solid #eadfc8;border-radius:22px;padding:28px}.logo{width:140px;display:block;margin:auto}.price{font-size:38px;font-weight:900;color:#d89a00}.btn{background:#e0a200;border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;width:100%;margin:10px 0}.btn:hover{background:#d89a00}.muted{color:#716958}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8ccb2;border-radius:9px;margin:8px 0 14px}.success{background:#e8f5e9;color:#1b5e20;border:1px solid #81c784;border-radius:8px;padding:14px;margin:14px 0}.error{background:#ffebee;color:#b71c1c;border:1px solid #ef5350;border-radius:8px;padding:14px;margin:14px 0}.divider{border:0;border-top:1px solid #eadfc8;margin:20px 0}.tabs{display:flex;gap:10px;margin:20px 0}.tab-btn{flex:1;padding:10px;border:1px solid #d8ccb2;background:#fff;border-radius:8px;cursor:pointer;font-weight:600}.tab-btn.active{background:#e0a200;color:#fff;border-color:#d89a00}.tab-content{display:none}.tab-content.active{display:block}</style>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#e0a200"><link rel="apple-touch-icon" href="/assets/world-tv-logo.png"><link rel="icon" href="/assets/world-tv-logo.png"><meta property="og:site_name" content="World TV"><meta property="og:type" content="website"><meta property="og:image" content="https://myworldtvlive.com/assets/world-tv-logo.png"><script src="/assets/site-meta.js"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body><div class="box">
<img class="logo" src="/world-tv-logo.png">
<h1>World TV Subscription</h1>
<h2>1 Year</h2>
<div class="price">GH₵299.00</div>
<p class="muted">Choose your payment method below.</p>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('paystack')">💳 Paystack</button>
  <button class="tab-btn" onclick="switchTab('code')">🎫 Subscription Code</button>
</div>

<div id="paystack-tab" class="tab-content active">
  <div id="paystack-msg"></div>
  <label>Email</label>
  <input id="paystack-email" placeholder="your@email.com" readonly>
  <label>Plan</label>
  <input id="paystack-plan" value="World TV - 1 Year" readonly>
  <label>Amount</label>
  <input id="paystack-amount" value="GH₵299.00" readonly>
  <button class="btn" onclick="initPaystack()">Pay Now with Paystack</button>
</div>

<div id="code-tab" class="tab-content">
  <label>Coupon/Subscription Code (optional)</label>
  <input id="coupon" placeholder="Enter coupon or subscription code">
  <button class="btn" onclick="createRequest()">Create Request</button>
  <div id="msg"></div>
</div>

<div class="divider"></div>
<p><a href="/account.html">My Account</a> · <a href="/">Home</a></p>
</div>

<script>
const token = localStorage.getItem("wtv_customer_token");
if (!token) { location.href = "/login.html" }

// Fetch user email
(async () => {
  const resp = await fetch("/api/customer/me", {
    headers: { "x-customer-token": token }
  });
  if (resp.ok) {
    const user = await resp.json();
    document.getElementById("paystack-email").value = user.user.email;
  }
})();

function switchTab(tab) {
  document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
  document.getElementById(tab + "-tab").classList.add("active");
  event.target.classList.add("active");
}

// Paystack Integration
async function initPaystack() {
  const msg = document.getElementById("paystack-msg");
  msg.textContent = "Initializing payment...";
  
  try {
    const resp = await fetch("/api/payment/paystack/initialize", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-customer-token": token
      },
      body: JSON.stringify({ planId: 1 })
    });
    
    const data = await resp.json();
    if (!resp.ok) {
      msg.innerHTML = `<div class="error">${data.error || "Payment initialization failed"}</div>`;
      return;
    }
    
    const handler = PaystackPop.setup({
      key: "pk_live_your_paystack_public_key", // Will be replaced with actual key from env
      email: data.payload.email,
      amount: data.payload.amount,
      ref: data.reference,
      metadata: data.payload.metadata,
      onClose: () => {
        msg.innerHTML = `<div class="error">Payment window closed</div>`;
      },
      onSuccess: (response) => {
        verifyPayment(data.reference, response.reference);
      }
    });
    
    handler.openIframe();
  } catch (error) {
    msg.innerHTML = `<div class="error">${error.message}</div>`;
  }
}

async function verifyPayment(reference, paystackRef) {
  const msg = document.getElementById("paystack-msg");
  msg.textContent = "Verifying payment...";
  
  try {
    const resp = await fetch("/api/payment/paystack/verify", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ reference })
    });
    
    const data = await resp.json();
    if (resp.ok) {
      msg.innerHTML = `<div class="success"><h2>✓ Payment Successful!</h2><p>Your subscription has been activated.</p><p>Reference: <b>${reference}</b></p><p><a href="/account.html">View your account</a></p></div>`;
    } else {
      msg.innerHTML = `<div class="error">Verification failed: ${data.error}</div>`;
    }
  } catch (error) {
    msg.innerHTML = `<div class="error">Verification error: ${error.message}</div>`;
  }
}

// Code redemption (fallback)
async function createRequest() {
  const msg = document.getElementById("msg");
  msg.textContent = "Creating request...";
  
  const resp = await fetch("/api/customer/checkout-request", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-customer-token": token
    },
    body: JSON.stringify({ planId: 1, coupon_code: document.getElementById("coupon").value })
  });
  
  const data = await resp.json();
  if (resp.ok) {
    msg.innerHTML = `<div class="success"><h2>Subscription Request Created</h2><p>Reference: <b>${data.reference}</b></p>${data.discount_ghs ? `<p>Discount: GH₵${data.discount_ghs.toFixed(2)}</p>` : ""}<p>Amount due: <b>GH₵${data.final_amount_ghs.toFixed(2)}</b></p><p class="muted">Please contact World TV administration with this reference to complete your payment.</p></div>`;
  } else {
    msg.innerHTML = `<div class="error">${data.error || "Could not create request"}</div>`;
  }
}
</script>
<script src="/assets/pwa.js"></script>
</body></html>
