<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Order — World TV</title>
<style>body{margin:0;font-family:system-ui;background:#fff9eb;color:#17130a}.box{width:min(700px,92%);margin:45px auto;background:#fff;border:1px solid #eadfc8;border-radius:22px;padding:28px}.logo{width:130px;display:block;margin:auto}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;border:1px solid #d8ccb2;border-radius:9px;font:inherit}.btn{background:#e0a200;border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.65;cursor:not-allowed}.muted{color:#716958}.shipping{margin-top:18px;padding:18px;border:1px solid #eadfc8;border-radius:14px;background:#fffaf0}.shipping h2{margin:0 0 6px;font-size:20px}.required{color:#a33}.error{margin-top:12px;padding:14px;border-radius:10px;background:#fff0f0;color:#a33;font-weight:700}.success{margin-top:16px;padding:16px;border-radius:12px;background:#edf9ef;color:#155724}.paybox{margin-top:18px;padding-top:16px;border-top:1px solid #cfe5d2}.paybox h3{margin:0 0 8px}.pay-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.paybtn{width:100%;border:0;border-radius:12px;padding:14px 16px;font-weight:900;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px}.paybtn svg{width:24px;height:24px;flex:0 0 24px}.mobilemoney{background:#e0a200;color:#17130a}.card{background:#202a44;color:#fff}.paypal{background:#0877d1;color:#fff;grid-column:1/-1}.paybtn:disabled{opacity:.6;cursor:not-allowed}#currency-selector{margin:20px 0;text-align:center}#currency-dropdown{padding:8px 12px;border:1px solid #d8ccb2;border-radius:8px;background:#fff;font-weight:700;cursor:pointer;font-size:14px}@media(max-width:560px){.pay-actions{grid-template-columns:1fr}.paypal{grid-column:auto}}</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#e0a200"><link rel="apple-touch-icon" href="/assets/world-tv-logo.png"><link rel="icon" href="/assets/world-tv-logo.png"><meta property="og:site_name" content="World TV"><meta property="og:type" content="website"><meta property="og:image" content="https://myworldtvlive.com/assets/world-tv-logo.png"><script src="/assets/site-meta.js"></script></head>
<body><div class="box"><img class="logo" src="/world-tv-logo.png"><h1>Place Product Order</h1><p class="muted">Submit your shipping details, then pay securely to complete your order.</p>
<div id="currency-selector"><strong>Currency:</strong> </div>
<form id="f"><label>Product</label><select id="product" required><option value="">Loading products...</option></select><label>Quantity</label><input id="qty" type="number" min="1" value="1" required><label>Your name</label><input id="name" autocomplete="name" required><label>Phone / WhatsApp</label><input id="phone" autocomplete="tel" required><label>Email <span class="required">*</span></label><input id="email" type="email" autocomplete="email" required>
<div class="shipping"><h2>Shipping Details</h2><p class="muted">Required so we can ship your order to the correct destination.</p><label>Country <span class="required">*</span></label><input id="country" autocomplete="country-name" placeholder="Example: Ghana, United States, United Kingdom" required><label>Full shipping address <span class="required">*</span></label><textarea id="shippingAddress" autocomplete="street-address" rows="3" placeholder="House / apartment, street, area, city, state or region, postal code" required></textarea></div>
<label>Notes</label><textarea id="notes" placeholder="Optional delivery instructions"></textarea><button id="submitBtn" class="btn" type="submit">Submit Order & Continue to Payment</button></form><div id="msg"></div><p class="muted">Name, phone, email, product, country and full shipping address are required.</p><p><a href="/products.html">Back to Products</a></p></div>
<script>
const form=document.getElementById("f"),productEl=document.getElementById("product"),qtyEl=document.getElementById("qty"),nameEl=document.getElementById("name"),phoneEl=document.getElementById("phone"),emailEl=document.getElementById("email"),countryEl=document.getElementById("country"),addressEl=document.getElementById("shippingAddress"),notesEl=document.getElementById("notes"),msgEl=document.getElementById("msg"),submitBtn=document.getElementById("submitBtn");
const phoneIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 5h4M11 18.5h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 9.5h3M4 13h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const cardIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2 9h20M6 15h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function selectedIsTvBox(){return productEl.selectedOptions?.[0]?.dataset?.tvBox==="1";}
async function displayTotal(serverTotal,country,quantity){
  if(!selectedIsTvBox()||!window.WorldTvProductPricing) return {primary:`GH₵${Number(serverTotal).toFixed(2)}`,note:""};
  const q=window.WorldTvProductPricing.quote({country,currency:window.CurrencyConverter?.activeCurrency||"USD",quantity});
  return {primary:q.primary,note:q.secondary};
}
async function paymentButtons(orderNumber,total,country,quantity){
  const shown=await displayTotal(total,country,quantity);
  return `<h2>Order Received</h2><p>Your order number is <b>${orderNumber}</b>.</p><p>Total: <b>${shown.primary}</b></p>${shown.note?`<p><b>${shown.note}</b></p>`:""}<p>Shipping to: <b>${country}</b></p><div class="paybox"><h3>Complete Your Payment</h3><p>Your order is saved. Choose how you want to pay now.</p><div class="pay-actions"><button class="paybtn mobilemoney" onclick="startPaystack('${orderNumber}','mobile_money',this)">${phoneIcon}<span>Pay with Mobile Money</span></button><button class="paybtn card" onclick="startPaystack('${orderNumber}','card',this)">${cardIcon}<span>Pay with Card</span></button><button class="paybtn paypal" onclick="startPayPal('${orderNumber}',this)"><span>Pay with PayPal</span></button></div><p class="muted" style="margin-bottom:0">Your order will be confirmed automatically after successful payment.</p></div>`;
}
async function startPaystack(orderNumber,channel,button){const original=button.innerHTML;button.disabled=true;button.textContent=channel==="mobile_money"?"Opening Mobile Money...":"Opening Card Payment...";try{const r=await fetch("/api/product-payments/paystack/initialize",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({order_number:orderNumber,channel})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.authorization_url) throw new Error(d.error||"Could not start payment");location.href=d.authorization_url;}catch(e){button.disabled=false;button.innerHTML=original;alert(e.message);}}
async function startPayPal(orderNumber,button){button.disabled=true;button.textContent="Opening PayPal...";try{const r=await fetch("/api/product-payments/paypal/create-order",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({order_number:orderNumber})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.approval_url) throw new Error(d.error||"Could not start PayPal payment");location.href=d.approval_url;}catch(e){button.disabled=false;button.textContent="Pay with PayPal";alert(e.message);}}
window.startPaystack=startPaystack;window.startPayPal=startPayPal;
async function handlePaymentReturn(){const q=new URLSearchParams(location.search);const payment=q.get("payment"),order=q.get("order");if(!payment||!order) return false;form.style.display="none";msgEl.className="success";if(payment==="cancelled"){msgEl.className="error";msgEl.innerHTML=`<h2>Payment Cancelled</h2><p>Your order <b>${order}</b> is still saved. You can return to Products and try again.</p>`;return true;}msgEl.innerHTML="<h2>Confirming Payment...</h2><p>Please wait while World TV verifies your payment.</p>";try{let r,d;if(payment==="paystack"){const reference=q.get("payment_reference")||q.get("reference")||q.get("trxref");r=await fetch(`/api/product-payments/paystack/verify?order_number=${encodeURIComponent(order)}&reference=${encodeURIComponent(reference||"")}`,{cache:"no-store",headers:{Accept:"application/json"}});d=await r.json().catch(()=>({}));}else if(payment==="paypal"){const token=q.get("token");r=await fetch("/api/product-payments/paypal/capture",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({order_number:order,paypal_order_id:token})});d=await r.json().catch(()=>({}));}else{return false;}if(!r.ok||!d.paid) throw new Error(d.error||"Payment could not be verified");const paidTotal=d.total_usd?`$${Number(d.total_usd).toFixed(2)} USD`:`GH₵${Number(d.total_ghs).toFixed(2)}`;msgEl.className="success";msgEl.innerHTML=`<h2>✅ Payment Successful</h2><p>Thank you. Your order <b>${order}</b> has been paid and confirmed.</p><p>Total paid: <b>${paidTotal}</b></p><p>Payment method: <b>${d.provider}</b></p><p>We can now process your shipment.</p><p><a href="/products.html">Continue Shopping</a></p>`;history.replaceState({},"",`/order.html?order=${encodeURIComponent(order)}&paid=1`);}catch(e){msgEl.className="error";msgEl.innerHTML=`<h2>Payment Verification Problem</h2><p>${e.message}</p><p>Your order number is <b>${order}</b>. Please do not make a second payment until this is checked.</p>`;}return true;}
(async()=>{if(await handlePaymentReturn()) return;try{const r=await fetch(`/api/products?_=${Date.now()}`,{cache:"no-store",headers:{Accept:"application/json"}});if(!r.ok) throw new Error(`HTTP ${r.status}`);const ps=await r.json();if(!Array.isArray(ps)||!ps.length) throw new Error("No products available");productEl.innerHTML=ps.map(p=>{const tvBox=/android\s*tv\s*box|world\s*tv\s*box/i.test(String(p.name||""));const price=tvBox?" — Ghana GH₵850 / International US$100 equivalent":p.price_ghs!=null?" — GH₵"+Number(p.price_ghs).toFixed(2):"";return `<option value="${p.id}" data-tv-box="${tvBox?1:0}">${p.name}${price}</option>`}).join("");const productId=new URLSearchParams(window.location.search).get("product");if(productId&&ps.some(p=>String(p.id)===String(productId))) productEl.value=productId;}catch(e){productEl.innerHTML='<option value="">No product available</option>';msgEl.className="error";msgEl.textContent="Could not load products. Please refresh and try again.";}})();
form.addEventListener("submit",async e=>{e.preventDefault();msgEl.className="";msgEl.textContent="";const customerName=nameEl.value.trim(),customerPhone=phoneEl.value.trim(),customerEmail=emailEl.value.trim(),productId=productEl.value,countryValue=countryEl.value.trim(),addressValue=addressEl.value.trim();if(!customerName||!customerPhone||!customerEmail||!productId||!countryValue||!addressValue){msgEl.className="error";msgEl.textContent="Please complete all required fields before submitting your order.";return;}const deliveryLocation=`${countryValue} — ${addressValue}`;const quantity=Number(qtyEl.value||1);const payload={customer_name:customerName,name:customerName,email:customerEmail,phone:customerPhone,customer_phone:customerPhone,product_id:productId,product:productId,quantity,country:countryValue,shipping_address:addressValue,delivery_location:deliveryLocation,notes:notesEl.value.trim()};submitBtn.disabled=true;submitBtn.textContent="Submitting...";try{const r=await fetch("/api/product-orders",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},cache:"no-store",body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok) throw new Error(d.error||`Could not submit order (HTTP ${r.status})`);form.style.display="none";msgEl.className="success";msgEl.innerHTML=await paymentButtons(d.order_number,d.total_ghs,countryValue,quantity);window.scrollTo({top:msgEl.offsetTop-20,behavior:"smooth"});}catch(err){msgEl.className="error";msgEl.textContent=err.message||"Could not submit order";submitBtn.disabled=false;submitBtn.textContent="Submit Order & Continue to Payment";}});
</script><script src="/assets/pwa.js"></script><script src="/assets/currency-converter.js"></script><script src="/assets/product-pricing.js?v=1"></script></body></html>
