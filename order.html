<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Order — World TV</title>
<style>body{margin:0;font-family:system-ui;background:#fff9eb;color:#17130a}.box{width:min(700px,92%);margin:45px auto;background:#fff;border:1px solid #eadfc8;border-radius:22px;padding:28px}.logo{width:130px;display:block;margin:auto}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;border:1px solid #d8ccb2;border-radius:9px;font:inherit}.btn{background:#e0a200;border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.65;cursor:not-allowed}.muted{color:#716958}.shipping{margin-top:18px;padding:18px;border:1px solid #eadfc8;border-radius:14px;background:#fffaf0}.shipping h2{margin:0 0 6px;font-size:20px}.required{color:#a33}.error{margin-top:12px;color:#a33;font-weight:700}.success{margin-top:16px;padding:16px;border-radius:12px;background:#edf9ef;color:#155724}#currency-selector{margin:20px 0;text-align:center}#currency-dropdown{padding:8px 12px;border:1px solid #d8ccb2;border-radius:8px;background:#fff;font-weight:700;cursor:pointer;font-size:14px}</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#e0a200"><link rel="apple-touch-icon" href="/assets/world-tv-logo.png"><link rel="icon" href="/assets/world-tv-logo.png"><meta property="og:site_name" content="World TV"><meta property="og:type" content="website"><meta property="og:image" content="https://myworldtvlive.com/assets/world-tv-logo.png"><script src="/assets/site-meta.js"></script></head>
<body><div class="box"><img class="logo" src="/world-tv-logo.png"><h1>Place Product Order</h1><p class="muted">Submit your order. World TV can confirm payment and delivery with you separately.</p>
<div id="currency-selector"><strong>Currency:</strong> </div>
<form id="f"><label>Product</label><select id="product" required><option value="">Loading products...</option></select><label>Quantity</label><input id="qty" type="number" min="1" value="1" required><label>Your name</label><input id="name" autocomplete="name" required><label>Phone / WhatsApp</label><input id="phone" autocomplete="tel" required><label>Email</label><input id="email" type="email" autocomplete="email">
<div class="shipping"><h2>Shipping Details</h2><p class="muted">Required so we can ship your order to the correct destination.</p><label>Country <span class="required">*</span></label><input id="country" autocomplete="country-name" placeholder="Example: Ghana, United States, United Kingdom" required><label>Full shipping address <span class="required">*</span></label><textarea id="shippingAddress" autocomplete="street-address" rows="3" placeholder="House / apartment, street, area, city, state or region, postal code" required></textarea></div>
<label>Notes</label><textarea id="notes" placeholder="Optional delivery instructions"></textarea><button id="submitBtn" class="btn" type="submit">Submit Order</button></form><div id="msg"></div><p class="muted">Name, phone, product, country and full shipping address are required.</p><p><a href="/products.html">Back to Products</a></p></div>
<script>
const form=document.getElementById("f");
const productEl=document.getElementById("product");
const qtyEl=document.getElementById("qty");
const nameEl=document.getElementById("name");
const phoneEl=document.getElementById("phone");
const emailEl=document.getElementById("email");
const countryEl=document.getElementById("country");
const addressEl=document.getElementById("shippingAddress");
const notesEl=document.getElementById("notes");
const msgEl=document.getElementById("msg");
const submitBtn=document.getElementById("submitBtn");

(async()=>{
  try{
    const r=await fetch(`/api/products?_=${Date.now()}`,{cache:"no-store",headers:{Accept:"application/json"}});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const ps=await r.json();
    if(!Array.isArray(ps)||!ps.length) throw new Error("No products available");
    productEl.innerHTML=ps.map(p=>`<option value="${p.id}" data-price-ghs="${p.price_ghs}">${p.name}${p.price_ghs!=null?" — GH₵"+Number(p.price_ghs).toFixed(2):""}</option>`).join("");
    const q=new URLSearchParams(window.location.search).get("product");
    if(q&&ps.some(p=>String(p.id)===String(q))) productEl.value=q;
  }catch(e){
    productEl.innerHTML='<option value="">No product available</option>';
    msgEl.className="error";
    msgEl.textContent="Could not load products. Please refresh and try again.";
  }
})();

form.addEventListener("submit",async e=>{
  e.preventDefault();
  msgEl.className="";
  msgEl.textContent="";
  const customerName=nameEl.value.trim();
  const customerPhone=phoneEl.value.trim();
  const productId=productEl.value;
  const countryValue=countryEl.value.trim();
  const addressValue=addressEl.value.trim();
  if(!customerName||!customerPhone||!productId||!countryValue||!addressValue){
    msgEl.className="error";
    msgEl.textContent="Please complete all required fields before submitting your order.";
    return;
  }
  const deliveryLocation=`${countryValue} — ${addressValue}`;
  const payload={
    customer_name:customerName,
    name:customerName,
    email:emailEl.value.trim(),
    phone:customerPhone,
    customer_phone:customerPhone,
    product_id:productId,
    product:productId,
    quantity:Number(qtyEl.value||1),
    country:countryValue,
    shipping_address:addressValue,
    delivery_location:deliveryLocation,
    notes:notesEl.value.trim()
  };
  submitBtn.disabled=true;
  submitBtn.textContent="Submitting...";
  try{
    const r=await fetch("/api/product-orders",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},cache:"no-store",body:JSON.stringify(payload)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||`Could not submit order (HTTP ${r.status})`);
    form.style.display="none";
    msgEl.className="success";
    msgEl.innerHTML=`<h2>Order Received</h2><p>Your order number is <b>${d.order_number}</b>.</p>${d.total_ghs!=null?`<p>Total: <b>GH₵${Number(d.total_ghs).toFixed(2)}</b></p>`:""}<p>Shipping to: <b>${countryValue}</b></p><p>Keep your order number for tracking.</p>`;
  }catch(err){
    msgEl.className="error";
    msgEl.textContent=err.message||"Could not submit order";
    submitBtn.disabled=false;
    submitBtn.textContent="Submit Order";
  }
});
</script><script src="/assets/pwa.js"></script><script src="/assets/currency-converter.js"></script></body></html>
