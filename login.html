<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WORLD TV Login</title><meta name="robots" content="noindex,nofollow"><style>:root{--bg:#090909;--panel:#141414;--line:#2c2412;--gold:#f1bd3b;--muted:#aaa}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 0,#322100 0,#111 34%,#090909 72%);color:#fff;margin:0;min-height:100vh}.box{width:min(460px,92%);margin:54px auto;background:rgba(20,20,20,.97);padding:30px;border-radius:22px;border:1px solid var(--line);box-shadow:0 24px 70px #0008}.logo{width:138px;display:block;margin:0 auto 18px}h1{margin:0 0 8px;text-align:center}.intro{text-align:center;color:var(--muted);margin:0 0 22px;line-height:1.5}label{font-size:13px;font-weight:800}input{width:100%;padding:13px;margin:6px 0 15px;border:1px solid #40371f;border-radius:10px;background:#0d0d0d;color:#fff;font-size:16px}.btn{width:100%;padding:14px;border:0;border-radius:11px;background:linear-gradient(135deg,#ffd764,#c88b00);color:#17110a;font-weight:900;font-size:16px;cursor:pointer}.btn:disabled{opacity:.6}.muted{color:var(--muted)}a{color:var(--gold)}#msg{min-height:20px}.links{text-align:center;margin-top:18px;line-height:1.7}</style><link rel="icon" href="/world-tv-logo.png"><script src="/assets/site-meta.js"></script></head><body><main class="box"><a href="/"><img class="logo" src="/world-tv-logo.png" alt="WORLD TV"></a><h1>Welcome Back</h1><p class="intro">Sign in to manage your subscription, payment history and activation code.</p><form id="f"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="btn" id="loginBtn" type="submit">Login</button></form><p><a href="/forgot-password.html">Forgot your password?</a></p><p id="msg" class="muted" role="status"></p><p class="links muted">New customer? <a id="createAccountLink" href="/register.html">Create account</a><br><a href="/">Back to Home</a></p></main><script>const params=new URLSearchParams(location.search);const requested=params.get('next')||'';const next=requested.startsWith('/')&&!requested.startsWith('//')?requested:'';const createLink=document.getElementById('createAccountLink');if(next)createLink.href='/register.html?next='+encodeURIComponent(next);document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg'),btn=document.getElementById('loginBtn');msg.textContent='Signing in...';btn.disabled=true;try{const r=await fetch('/api/customer/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Could not sign in');if(!d.token)throw new Error('Login succeeded but no session was returned');localStorage.setItem('wtv_customer_token',d.token);location.href=next||'/account.html'}catch(error){msg.textContent=error.message||'Could not sign in';btn.disabled=false}});</script><script src="/assets/pwa.js"></script><script src="/assets/language-selector.js?v=1"></script></body></html>
