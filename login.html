<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World TV Login</title>
<style>body{font-family:system-ui,sans-serif;background:#fff9eb;margin:0}.box{width:min(460px,92%);margin:60px auto;background:#fff;padding:28px;border-radius:20px;border:1px solid #eadfc8}.logo{width:125px;display:block;margin:auto}input{width:100%;box-sizing:border-box;padding:13px;margin:6px 0 14px;border:1px solid #d8ccb2;border-radius:10px}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#e0a200;font-weight:800}.muted{color:#716958}</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#e0a200"><link rel="apple-touch-icon" href="/assets/world-tv-logo.png"><link rel="icon" href="/assets/world-tv-logo.png"><meta property="og:site_name" content="World TV"><meta property="og:type" content="website"><meta property="og:image" content="https://myworldtvlive.com/assets/world-tv-logo.png"><script src="/assets/site-meta.js"></script><meta name="robots" content="noindex,nofollow"></head>
<body><div class="box"><img class="logo" src="/world-tv-logo.png"><h2>Login</h2><form id="f"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="btn">Login</button></form><p><a href="/forgot-password.html">Forgot your password?</a></p><p id="msg" class="muted"></p><p class="muted">New customer? <a href="/register.html">Create account</a></p></div>
<script>f.onsubmit=async e=>{e.preventDefault();msg.textContent="Signing in...";let r=await fetch("/api/customer/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});let d=await r.json();if(!r.ok){msg.textContent=d.error;return}localStorage.setItem("wtv_customer_token",d.token);const next=new URLSearchParams(location.search).get("next");location.href=next&&next.startsWith("/")&&!next.startsWith("//")?next:"/account.html"}</script><script src="/assets/pwa.js"></script></body></html>
