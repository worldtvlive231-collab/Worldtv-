<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service Status — World TV</title><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#e0a200"></head><body style="font-family:system-ui;background:#fff9eb;color:#17130a"><main style="width:min(650px,92%);margin:60px auto;background:white;border:1px solid #eadfc8;border-radius:20px;padding:30px"><img src="/assets/world-tv-logo.png" style="width:140px;display:block;margin:auto"><h1>World TV Service Status</h1><div id="status">Checking service...</div><p><a href="/">Return Home</a></p></main><script>Promise.all([fetch("/health").then(r=>r.json()),fetch("/api/launch-readiness").then(r=>r.json())]).then(([h,r])=>{status.innerHTML=`<p><b>Website:</b> ${h.ok?"Online":"Unavailable"}</p><p><b>Customer Accounts:</b> ${r.customer_accounts?"Ready":"Unavailable"}</p><p><b>Subscriptions:</b> ${r.subscriptions?"Ready":"Unavailable"}</p><p><b>Product Orders:</b> ${r.product_orders?"Ready":"Unavailable"}</p><p><b>Online Payments:</b> ${r.online_payments?"Enabled":"Not enabled yet"}</p>`}).catch(()=>status.innerHTML="<p>Unable to retrieve current status.</p>")</script><script src="/assets/pwa.js"></script></body></html>
