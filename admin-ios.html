<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>WORLD TV ADMIN</title>
  <meta name="theme-color" content="#17130a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WORLD TV ADMIN">
  <link rel="manifest" href="/admin.webmanifest?v=2">
  <link rel="apple-touch-icon" href="/world-tv-logo.png?v=admin-ios-v2">
  <link rel="icon" href="/world-tv-logo.png?v=admin-ios-v2">
  <meta name="robots" content="noindex,nofollow">
  <style>
    html,body{height:100%;margin:0;background:#17130a;overflow:hidden}
    #adminFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f8f6f0}
  </style>
</head>
<body>
  <iframe id="adminFrame" src="/admin" title="WORLD TV ADMIN"></iframe>
  <script>
    (function(){
      const frame=document.getElementById('adminFrame');
      frame.addEventListener('load',function(){
        try{
          const doc=frame.contentDocument;
          if(!doc||doc.getElementById('worldtv-ios-admin-style')) return;
          doc.title='WORLD TV ADMIN';
          const style=doc.createElement('style');
          style.id='worldtv-ios-admin-style';
          style.textContent=`
            @media (max-width: 700px) {
              html,body{max-width:100%;overflow-x:hidden}
              body{padding-bottom:96px}
              .wrap{width:94% !important}
              header .nav{height:60px !important}
              header .logo{height:46px !important;width:84px !important}
              #dashboard>h1{font-size:30px !important;line-height:1.08 !important;margin:22px 0 14px !important}
              .grid{grid-template-columns:1fr 1fr !important;gap:10px !important}
              .grid .card{margin:0 !important;padding:16px !important;min-height:112px !important;border-radius:16px !important}
              .stat{font-size:36px !important}
              .card{padding:16px !important;margin:14px 0 !important;border-radius:16px !important}
              .tabs{position:fixed !important;left:0 !important;right:0 !important;bottom:0 !important;z-index:9999 !important;background:#fffdf7 !important;border-top:1px solid #eadfc8 !important;padding:8px 10px calc(8px + env(safe-area-inset-bottom)) !important;display:flex !important;gap:7px !important;overflow-x:auto !important;flex-wrap:nowrap !important;box-shadow:0 -8px 24px #00000012 !important;-webkit-overflow-scrolling:touch}
              .tabs .tab{flex:0 0 auto !important;white-space:nowrap !important;padding:10px 13px !important;font-size:14px !important;border-radius:12px !important}
              table{font-size:12px !important}
              th,td{padding:8px !important}
              input,textarea,select{font-size:16px !important}
              .formgrid{grid-template-columns:1fr !important;gap:8px !important}
              .modal{padding:10px !important}
              .modalbox{padding:18px !important;border-radius:16px !important}
            }
          `;
          doc.head.appendChild(style);
        }catch(e){}
      });
    })();
  </script>
</body>
</html>
