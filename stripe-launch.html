<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opening Secure Stripe Checkout — WORLD TV</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--gold:#d89a00;--line:#eadfc8;--muted:#716958;--stripe:#635bff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#fffdf8,#f7f4ec);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17130a;padding:20px}.card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;text-align:center;box-shadow:0 20px 55px rgba(0,0,0,.10)}img{width:120px;height:auto;object-fit:contain}h1{font-size:26px;margin:16px 0 8px}p{color:var(--muted);line-height:1.55}.spinner{width:42px;height:42px;border:4px solid #e6e3ff;border-top-color:var(--stripe);border-radius:50%;margin:20px auto;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.btn{display:flex;width:100%;align-items:center;justify-content:center;border:0;border-radius:13px;padding:15px 18px;background:var(--stripe);color:#fff;font-weight:900;text-decoration:none;font-size:16px;margin-top:16px}.small{font-size:12px;margin-top:12px}.error{color:#8d2222;background:#fff0f0;border:1px solid #efc5c5;border-radius:12px;padding:12px;margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <img src="/world-tv-logo.png" alt="WORLD TV">
  <h1>Opening Secure Stripe Checkout</h1>
  <p>WORLD TV is connecting you to Stripe's secure payment page.</p>
  <div class="spinner" id="spinner"></div>
  <a class="btn" id="continueBtn" href="#" rel="noopener">Continue to Stripe Checkout</a>
  <p class="small">If the payment page does not open automatically, tap the button above.</p>
  <div id="error" class="error" hidden></div>
</div>
<script>
(()=>{
  const button=document.getElementById('continueBtn');
  const error=document.getElementById('error');
  const spinner=document.getElementById('spinner');
  function fail(message){spinner.style.display='none';button.style.display='none';error.hidden=false;error.textContent=message;}
  let target='';
  try{
    const raw=location.hash.slice(1);
    if(!raw)throw new Error('Missing Stripe checkout link.');
    target=decodeURIComponent(atob(raw.replace(/-/g,'+').replace(/_/g,'/')));
    const url=new URL(target);
    if(url.protocol!=='https:'||url.hostname!=='checkout.stripe.com')throw new Error('Invalid Stripe checkout link.');
    button.href=url.href;
    button.addEventListener('click',()=>{spinner.style.display='block';});
    setTimeout(()=>{window.location.replace(url.href);},650);
  }catch(e){fail(e.message||'Could not open Stripe checkout. Please return to the subscription page and try again.');}
})();
</script>
</body>
</html>
