name: Cloudflare preview safety check

on:
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/cloudflare-preview-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-static-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate builder syntax
        run: node --check cloudflare/build-preview.mjs
      - name: Build preview without secrets
        run: node cloudflare/build-preview.mjs
      - name: Check output is read-only and contains no backend sources
        shell: bash
        run: |
          set -euo pipefail
          test -f cloudflare/preview-dist/index.html
          test -f cloudflare/preview-dist/_headers
          grep -q "CLOUDFLARE PREVIEW ONLY" cloudflare/preview-dist/index.html
          test ! -f cloudflare/preview-dist/server.js
          test ! -f cloudflare/preview-dist/.env
          test ! -f cloudflare/preview-dist/data/worldtv.sqlite
          test ! -d cloudflare/preview-dist/public/apps
          echo "Safe read-only preview output produced."
