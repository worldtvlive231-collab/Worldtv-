name: Cloudflare full staging offline tests

on:
  push:
    branches:
      - migration/cloudflare-preview-2026-10
      - migration/cloudflare-staging-phase5-2026-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staged authentication, subscriptions, sandbox payment, admin and chat
        run: node --test --test-concurrency=1 tests/*.test.mjs
