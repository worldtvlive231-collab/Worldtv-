name: Cloudflare full staging offline tests

on:
  push:
    branches:
      - migration/cloudflare-preview-2026-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staged authentication, subscriptions, sandbox payment, admin and chat
        run: |
          node --test \
            tests/cloudflare-staging-auth.test.mjs \
            tests/cloudflare-staging-subscriptions.test.mjs \
            tests/cloudflare-staging-paystack.test.mjs \
            tests/cloudflare-staging-paystack-route.test.mjs \
            tests/cloudflare-staging-admin-access.test.mjs \
            tests/cloudflare-staging-chat.test.mjs
