name: Build WORLD TV Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/worldtv-admin-apk
    paths:
      - 'admin-android/**'
      - '.github/workflows/build-admin-apk.yml'
  pull_request:
    paths:
      - 'admin-android/**'
      - '.github/workflows/build-admin-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p admin-android assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: world-tv-admin-debug-apk
          path: admin-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
