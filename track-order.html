<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order — World TV</title><style>body{font-family:system-ui;background:#fff9eb;color:#17130a}.box{width:min(650px,92%);margin:60px auto;background:#fff;padding:28px;border:1px solid #eadfc8;border-radius:20px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8ccb2;border-radius:9px;margin:10px 0}.btn{background:#e0a200;border:0;padding:12px 16px;border-radius:10px;font-weight:800}.muted{color:#716958}</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#e0a200"><link rel="apple-touch-icon" href="/assets/world-tv-logo.png"><link rel="icon" href="/assets/world-tv-logo.png"><meta property="og:site_name" content="World TV"><meta property="og:type" content="website"><meta property="og:image" content="https://myworldtvlive.com/assets/world-tv-logo.png"><script src="/assets/site-meta.js"></script></head><body><div class="box"><h1>Track Your Order</h1><input id="num" placeholder="WTV-..."><button class="btn" onclick="track()">Track Order</button><div id="result"></div><p><a href="/">Home</a></p></div><script>async function track(){const r=await fetch("/api/product-orders/"+encodeURIComponent(num.value.trim()));const d=await r.json();result.innerHTML=r.ok?`<h2>${d.product_name}</h2><p>Order: <b>${d.order_number}</b></p><p>Status: <b>${d.status.toUpperCase()}</b></p><p>Quantity: ${d.quantity}</p>${d.total_ghs!=null?`<p>Total: GH₵${Number(d.total_ghs).toFixed(2)}</p>`:""}<p class="muted">Placed ${new Date(d.created_at).toLocaleString()}</p>`:`<p>${d.error||"Order not found"}</p>`}</script><script src="/assets/pwa.js"></script></body></html>
