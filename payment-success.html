<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World TV Payment</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#fff9eb;color:#17130a}.box{width:min(620px,92%);margin:70px auto;background:#fff;border:1px solid #eadfc8;border-radius:22px;padding:30px;text-align:center}.logo{width:130px}.code{font-size:28px;font-weight:900;padding:18px;background:#fff8dd;border-radius:14px;word-break:break-all}.btn{display:inline-block;margin-top:15px;padding:12px 18px;border-radius:10px;background:#e0a200;color:#17130a;text-decoration:none;font-weight:800}.muted{color:#716958}</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#e0a200"><link rel="apple-touch-icon" href="/assets/world-tv-logo.png"><link rel="icon" href="/assets/world-tv-logo.png"><meta property="og:site_name" content="World TV"><meta property="og:type" content="website"><meta property="og:image" content="https://myworldtvlive.com/assets/world-tv-logo.png"><script src="/assets/site-meta.js"></script></head>
<body><div class="box"><img class="logo" src="/world-tv-logo.png"><h1>Checking your payment…</h1><p id="status" class="muted">Please wait.</p><div id="codeBox" style="display:none"><p>Your subscription code:</p><div id="code" class="code"></div><p id="expiry" class="muted"></p></div><a class="btn" href="/account.html">My Account</a></div>
<script>(async()=>{const ref=new URLSearchParams(location.search).get("reference");if(!ref){status.textContent="No payment reference was provided.";return}try{const r=await fetch("/api/paystack/verify/"+encodeURIComponent(ref));const d=await r.json();if(!r.ok)throw Error(d.error||"Payment verification failed");document.querySelector("h1").textContent="Payment successful";status.textContent="Your World TV subscription is ready.";codeBox.style.display="block";code.textContent=d.order.code;expiry.textContent="Expires: "+new Date(d.order.expires_at).toLocaleString()}catch(e){document.querySelector("h1").textContent="Payment not completed";status.textContent=e.message}})()</script><script src="/assets/pwa.js"></script></body></html>
