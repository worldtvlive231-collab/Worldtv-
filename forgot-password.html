<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password — World TV</title>
<style>body{margin:0;font-family:system-ui;background:#fff9eb;color:#17130a}.box{width:min(520px,92%);margin:70px auto;background:#fff;border:1px solid #eadfc8;border-radius:22px;padding:30px}.logo{width:135px;display:block;margin:auto}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8ccb2;border-radius:9px;margin:8px 0 14px}.btn{background:#e0a200;border:0;border-radius:10px;padding:12px 16px;font-weight:800}.muted{color:#716958;line-height:1.6}</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#e0a200"><link rel="apple-touch-icon" href="/assets/world-tv-logo.png"><link rel="icon" href="/assets/world-tv-logo.png"><meta property="og:site_name" content="World TV"><meta property="og:type" content="website"><meta property="og:image" content="https://myworldtvlive.com/assets/world-tv-logo.png"><script src="/assets/site-meta.js"></script><meta name="robots" content="noindex,nofollow"></head>
<body><div class="box"><img class="logo" src="/world-tv-logo.png"><h1>Forgot Password</h1><p class="muted">Enter the email used for your World TV account.</p><form id="f"><input id="email" type="email" required placeholder="Email address"><button class="btn">Send Reset Instructions</button></form><p id="msg" class="muted"></p><p><a href="/login.html">Back to Sign In</a></p></div>
<script>f.onsubmit=async e=>{e.preventDefault();msg.textContent="Please wait...";const r=await fetch("/api/customer/forgot-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value})});const d=await r.json();msg.textContent=d.message||d.error||"Done"}</script><script src="/assets/pwa.js"></script><script src="/assets/language-selector.js?v=1"></script>
</body></html>
