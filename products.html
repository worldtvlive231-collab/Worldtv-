<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>World TV Products</title>
<style>
:root{--gold:#d89a00;--line:#eadfc8;--cream:#fff9eb;--muted:#716958}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--cream);color:#17130a}.wrap{width:min(1120px,92%);margin:auto}
header{background:#fff;border-bottom:1px solid var(--line)}.nav{height:74px;display:flex;align-items:center;justify-content:space-between}.logo{height:60px;width:108px;object-fit:contain}
h1{font-size:42px;margin-bottom:8px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:30px 0 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 10px 30px #3323000d}.pic{height:220px;background:#f6e2a8;display:grid;place-items:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:64px}.body{padding:20px}.price{font-size:24px;font-weight:900;color:var(--gold)}.pill{display:inline-block;background:#f4edda;padding:5px 8px;border-radius:99px;font-size:12px}.btn{display:inline-block;background:#e0a200;padding:11px 14px;border-radius:10px;text-decoration:none;color:#17130a;font-weight:800;margin-top:10px}
#currency-selector{margin:20px 0;text-align:center}#currency-dropdown{padding:8px 12px;border:1px solid #d8ccb2;border-radius:8px;background:#fff;font-weight:700;cursor:pointer;font-size:14px}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#e0a200"><link rel="apple-touch-icon" href="/assets/world-tv-logo.png"><link rel="icon" href="/assets/world-tv-logo.png"><meta property="og:site_name" content="World TV"><meta property="og:type" content="website"><meta property="og:image" content="https://myworldtvlive.com/assets/world-tv-logo.png"><script src="/assets/site-meta.js"></script></head>
<body><header><div class="wrap nav"><a href="/"><img class="logo" src="/world-tv-logo.png"></a><a href="/">Home</a></div></header>
<main class="wrap"><h1>Products</h1><p class="muted">Shop products and services from World TV.</p><div id="currency-selector"><strong>Currency:</strong> </div><div id="grid" class="grid"></div></main>
<script>
function waLink(p){
 const n=(p.whatsapp_number||"+233244909092").replace(/\D/g,"");
 const text=encodeURIComponent(`Hello World TV, I am interested in ${p.name}${p.price_ghs!=null?` for GH₵${Number(p.price_ghs).toFixed(2)}`:""}.`);
 return `https://wa.me/${n}?text=${text}`;
}
(async()=>{
 const products=await fetch("/api/products").then(r=>r.json());
 const grid=document.getElementById("grid");
 if(!products.length){grid.innerHTML="<p>No products added yet.</p>";return}
 grid.innerHTML=products.map(p=>`<article class="card">
   <div class="pic">${p.image_url?`<img src="${p.image_url}" alt="${p.name}">`:`<div class="placeholder">📦</div>`}</div>
   <div class="body">
     <span class="pill">${p.category}</span>
     <h3>${p.name}</h3>
     <p class="muted">${p.description||""}</p>
     ${p.price_ghs!=null?`<div class="price" data-price-ghs="${p.price_ghs}">GH₵${Number(p.price_ghs).toFixed(2)}</div>`:""
}
     <p class="muted">${p.stock_status==="in_stock"?"In stock":p.stock_status==="preorder"?"Pre-order":"Out of stock"}</p>
     <a class="btn" href="/order.html?product=${p.id}">Order on Website</a> <a class="btn" target="_blank" rel="noopener" href="${waLink(p)}">WhatsApp</a>
   </div>
 </article>`).join("");
})();
</script><script src="/assets/pwa.js"></script><script src="/assets/currency-converter.js"></script></body></html>
