<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>World TV Products</title>
<style>
:root{--gold:#d89a00;--line:#eadfc8;--cream:#fff9eb;--muted:#716958}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--cream);color:#17130a}.wrap{width:min(1120px,92%);margin:auto}
header{background:#fff;border-bottom:1px solid var(--line)}.nav{height:74px;display:flex;align-items:center;justify-content:space-between}.logo{height:60px;width:108px;object-fit:contain}
h1{font-size:42px;margin-bottom:8px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:30px 0 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 10px 30px #3323000d}.pic{height:220px;background:#f6e2a8;display:grid;place-items:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:64px;display:grid;place-items:center;width:100%;height:100%}.body{padding:20px}.price{font-size:24px;font-weight:900;color:var(--gold)}.pill{display:inline-block;background:#f4edda;padding:5px 8px;border-radius:99px;font-size:12px}.btn{display:inline-block;background:#e0a200;padding:11px 14px;border-radius:10px;text-decoration:none;color:#17130a;font-weight:800;margin-top:10px}
#currency-selector{margin:20px 0;text-align:center}#currency-dropdown{padding:8px 12px;border:1px solid #d8ccb2;border-radius:8px;background:#fff;font-weight:700;cursor:pointer;font-size:14px}.status{grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#e0a200"><link rel="apple-touch-icon" href="/assets/world-tv-logo.png"><link rel="icon" href="/assets/world-tv-logo.png"><meta property="og:site_name" content="World TV"><meta property="og:type" content="website"><meta property="og:image" content="https://myworldtvlive.com/assets/world-tv-logo.png"><script src="/assets/site-meta.js"></script></head>
<body><header><div class="wrap nav"><a href="/"><img class="logo" src="/world-tv-logo.png"></a><a href="/">Home</a></div></header>
<main class="wrap"><h1>Products</h1><p class="muted">Shop products and services from World TV.</p><div id="currency-selector"><strong>Currency:</strong> </div><div id="grid" class="grid"><div class="status muted">Loading products...</div></div></main>
<script>
function waLink(p){
  const n=String(p.whatsapp_number||"+233244909092").replace(/\D/g,"");
  const price=p.price_ghs!=null?` for GH₵${Number(p.price_ghs).toFixed(2)}`:"";
  return `https://wa.me/${n}?text=${encodeURIComponent(`Hello World TV, I am interested in ${p.name}${price}.`)}`;
}
function addText(parent,tag,text,className){const el=document.createElement(tag);if(className)el.className=className;el.textContent=text;parent.appendChild(el);return el}
function makeProductCard(p){
  const card=document.createElement("article");card.className="card";
  const pic=document.createElement("div");pic.className="pic";card.appendChild(pic);
  const placeholder=document.createElement("div");placeholder.className="placeholder";placeholder.textContent="📦";
  if(p.image_url){
    const img=document.createElement("img");img.alt=p.name||"Product";img.src=p.image_url;
    img.addEventListener("error",()=>{img.remove();pic.appendChild(placeholder)});
    pic.appendChild(img);
  }else pic.appendChild(placeholder);
  const body=document.createElement("div");body.className="body";card.appendChild(body);
  addText(body,"span",p.category||"General","pill");
  addText(body,"h3",p.name||"Product");
  addText(body,"p",p.description||"","muted");
  if(p.price_ghs!=null){const price=addText(body,"div",`GH₵${Number(p.price_ghs).toFixed(2)}`,"price");price.setAttribute("data-price-ghs",p.price_ghs)}
  addText(body,"p",p.stock_status==="in_stock"?"In stock":p.stock_status==="preorder"?"Pre-order":"Out of stock","muted");
  const order=document.createElement("a");order.className="btn";order.href=`/order.html?product=${encodeURIComponent(p.id)}`;order.textContent="Order on Website";body.appendChild(order);
  body.appendChild(document.createTextNode(" "));
  const wa=document.createElement("a");wa.className="btn";wa.href=waLink(p);wa.target="_blank";wa.rel="noopener";wa.textContent="WhatsApp";body.appendChild(wa);
  return card;
}
async function loadProducts(){
  const grid=document.getElementById("grid");
  try{
    const r=await fetch(`/api/products?_=${Date.now()}`,{cache:"no-store",headers:{Accept:"application/json"}});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const products=await r.json();
    if(!Array.isArray(products)) throw new Error("Invalid products response");
    grid.innerHTML="";
    if(!products.length){grid.innerHTML='<div class="status muted">No products added yet.</div>';return}
    products.forEach(p=>grid.appendChild(makeProductCard(p)));
    if(window.CurrencyConverter) window.CurrencyConverter.updateAllPrices(window.CurrencyConverter.activeCurrency||"USD");
  }catch(err){
    console.error("Product loading failed",err);
    grid.innerHTML='<div class="status"><b>Unable to load products right now.</b><br><span class="muted">Please refresh the page.</span></div>';
  }
}
loadProducts();
</script><script src="/assets/pwa.js"></script><script src="/assets/currency-converter.js"></script></body></html>
