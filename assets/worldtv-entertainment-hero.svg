<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">WORLD TV entertainment collage</title><desc id="desc">Transparent illustration combining live football, movies and kids entertainment.</desc>
<defs>
  <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#ffd85b"/><stop offset="1" stop-color="#d99612"/></linearGradient>
  <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#55c8ff"/><stop offset="1" stop-color="#5d42ff"/></linearGradient>
  <linearGradient id="pink" x1="0" x2="1"><stop stop-color="#ff6aa4"/><stop offset="1" stop-color="#ff9b3d"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-opacity=".38"/></filter>
</defs>
<g opacity=".98" filter="url(#shadow)">
  <!-- football -->
  <g transform="translate(18 104)">
    <ellipse cx="255" cy="420" rx="220" ry="42" fill="#35b86a" opacity=".5"/>
    <path d="M55 305 Q220 175 400 260" fill="none" stroke="url(#blue)" stroke-width="12" opacity=".65" filter="url(#glow)"/>
    <path d="M84 235 Q185 80 330 116" fill="none" stroke="#cdeeff" stroke-width="7" opacity=".55"/>
    <g fill="#fff" opacity=".95"><circle cx="80" cy="180" r="7"/><circle cx="105" cy="161" r="7"/><circle cx="132" cy="151" r="7"/><circle cx="160" cy="147" r="7"/></g>
    <circle cx="115" cy="410" r="68" fill="#fff" stroke="#151515" stroke-width="7"/>
    <g fill="#111"><polygon points="115,365 91,383 101,412 129,412 139,383"/><polygon points="60,410 78,388 91,418 72,438"/><polygon points="170,410 152,388 139,418 158,438"/><polygon points="93,458 107,426 135,426 147,458 120,476"/></g>
    <g transform="translate(205 145)">
      <circle cx="92" cy="58" r="28" fill="#f0b28b"/>
      <path d="M62 92 Q92 72 126 94 L145 202 55 202Z" fill="#1f6fff"/>
      <path d="M57 104 L5 151" stroke="#f0b28b" stroke-width="19" stroke-linecap="round"/><path d="M132 110 L181 145" stroke="#f0b28b" stroke-width="19" stroke-linecap="round"/>
      <path d="M70 200 L38 300" stroke="#f7f7f7" stroke-width="24" stroke-linecap="round"/><path d="M125 200 L171 277" stroke="#f7f7f7" stroke-width="24" stroke-linecap="round"/>
      <path d="M31 299 L6 321" stroke="#111" stroke-width="18" stroke-linecap="round"/><path d="M170 278 L208 284" stroke="#111" stroke-width="18" stroke-linecap="round"/>
      <path d="M70 30 q25-30 54 0" fill="#1a1a1a"/>
    </g>
    <text x="214" y="38" fill="#d8f4ff" font-family="system-ui" font-size="26" font-weight="900">LIVE FOOTBALL</text>
  </g>
  <!-- cinema -->
  <g transform="translate(400 92)">
    <rect x="112" y="86" width="406" height="282" rx="25" fill="#0b0c12" stroke="#39394a" stroke-width="6"/>
    <rect x="130" y="104" width="370" height="245" rx="16" fill="url(#blue)"/>
    <circle cx="300" cy="207" r="67" fill="#101827" opacity=".55"/><polygon points="282,165 282,251 356,208" fill="#fff" opacity=".9"/>
    <path d="M170 326 Q270 236 420 304" fill="none" stroke="#ffc74f" stroke-width="9" opacity=".72"/>
    <g transform="translate(48 322)"><circle cx="92" cy="94" r="72" fill="#c7c8d1" stroke="#777" stroke-width="6"/><circle cx="92" cy="94" r="17" fill="#4b4c55"/><g fill="#4b4c55"><circle cx="92" cy="50" r="18"/><circle cx="132" cy="79" r="18"/><circle cx="117" cy="127" r="18"/><circle cx="67" cy="127" r="18"/><circle cx="52" cy="79" r="18"/></g></g>
    <g transform="translate(216 378)"><rect width="116" height="114" rx="10" fill="#f4f1df"/><path d="M0 30h116" stroke="#e44336" stroke-width="18"/><path d="M18 0v114M52 0v114M86 0v114" stroke="#e44336" stroke-width="12" opacity=".9"/><g fill="#fff3c1"><circle cx="24" cy="5" r="16"/><circle cx="50" cy="4" r="18"/><circle cx="78" cy="7" r="15"/><circle cx="102" cy="9" r="17"/></g></g>
    <g transform="translate(378 397)"><rect width="130" height="78" rx="8" fill="#161616"/><rect y="0" width="130" height="25" fill="#f7f7f7"/><path d="M5 0l24 25M36 0l24 25M67 0l24 25M98 0l24 25" stroke="#111" stroke-width="10"/></g>
    <text x="228" y="46" fill="#ffe18b" font-family="system-ui" font-size="26" font-weight="900">MOVIES</text>
  </g>
  <!-- kids -->
  <g transform="translate(815 94)">
    <path d="M34 410 Q178 302 350 385" fill="none" stroke="url(#pink)" stroke-width="16" opacity=".65" filter="url(#glow)"/>
    <circle cx="238" cy="246" r="105" fill="#ffd552"/>
    <circle cx="207" cy="222" r="13" fill="#171717"/><circle cx="270" cy="222" r="13" fill="#171717"/><path d="M205 266 Q239 294 274 262" fill="none" stroke="#a4462c" stroke-width="9" stroke-linecap="round"/>
    <circle cx="165" cy="330" r="54" fill="#8ddcff"/><circle cx="318" cy="328" r="62" fill="#ff7bab"/>
    <rect x="68" y="404" width="88" height="60" rx="10" fill="#48b56b"/><rect x="154" y="391" width="86" height="73" rx="10" fill="#ef4f45"/><rect x="238" y="414" width="86" height="50" rx="10" fill="#4c7dff"/>
    <polygon points="111,420 126,449 94,449" fill="#fff"/><circle cx="197" cy="427" r="17" fill="#fff"/><polygon points="281,423 287,442 307,442 291,454 297,473 281,461 265,473 271,454 255,442 275,442" fill="#fff"/>
    <g transform="translate(45 120)"><circle cx="36" cy="34" r="32" fill="#ffca38"/><path d="M16 10L0-20M56 10L72-20" stroke="#ffca38" stroke-width="18" stroke-linecap="round"/></g>
    <g transform="translate(325 112)"><ellipse cx="0" cy="0" rx="28" ry="42" fill="#f26aa0"/><path d="M-18 39l18 34 18-34" fill="#f26aa0"/></g>
    <g transform="translate(330 250)"><path d="M0 65 L28 0 L56 65Z" fill="#ef493f"/><rect x="22" y="60" width="12" height="44" fill="#f8c843"/><circle cx="28" cy="40" r="11" fill="#8bdfff"/></g>
    <text x="124" y="53" fill="#fff0a6" font-family="system-ui" font-size="26" font-weight="900">KIDS</text>
