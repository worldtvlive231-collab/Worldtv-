      <stop offset="0" stop-color="#64b5ff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity=".18"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <g opacity=".5">
