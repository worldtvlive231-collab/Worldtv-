      <path d="M120 105l50 45m25-45l50 45m25-45l50 45m25-45l50 45" stroke="#f2c84b" stroke-opacity=".45" stroke-width="12"/>
      <circle cx="180" cy="245" r="40" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="5"/>
      <circle cx="290" cy="245" r="40" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="5"/>
      <path d="M365 210l55 35-55 35z" fill="#f2c84b" fill-opacity=".38"/>
