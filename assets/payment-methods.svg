<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">World TV payment methods</title>
  <desc id="desc">Secure payment options including Mobile Money, Card and PayPal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7dd"/>
      <stop offset="1" stop-color="#f7c84b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6e5100" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="430" rx="40" fill="url(#bg)"/>
  <text x="70" y="76" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" fill="#17130a">Pay your way. Secure checkout.</text>
  <text x="70" y="116" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#62573f">Choose the payment method that works best for you.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="160" width="320" height="190" rx="26" fill="#ffffff"/>
    <circle cx="135" cy="225" r="38" fill="#fff2bd"/>
    <rect x="119" y="195" width="32" height="58" rx="8" fill="none" stroke="#c38800" stroke-width="6"/>
    <circle cx="135" cy="244" r="3" fill="#c38800"/>
    <path d="M165 210c17 6 27 19 29 37" fill="none" stroke="#c38800" stroke-width="6" stroke-linecap="round"/>
    <path d="M171 194c25 8 42 29 45 54" fill="none" stroke="#c38800" stroke-width="6" stroke-linecap="round" opacity=".55"/>
    <text x="105" y="297" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#17130a">Mobile Money</text>
    <text x="105" y="327" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#716958">Fast local payment</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="440" y="160" width="320" height="190" rx="26" fill="#ffffff"/>
    <circle cx="505" cy="225" r="38" fill="#eaf3ff"/>
    <rect x="474" y="205" width="62" height="40" rx="7" fill="none" stroke="#2867b2" stroke-width="6"/>
    <path d="M478 217h54" stroke="#2867b2" stroke-width="6"/>
    <path d="M486 235h17" stroke="#2867b2" stroke-width="5" stroke-linecap="round"/>
    <text x="475" y="297" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#17130a">Debit / Credit Card</text>
    <text x="475" y="327" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#716958">Secure card checkout</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="810" y="160" width="320" height="190" rx="26" fill="#ffffff"/>
    <circle cx="875" cy="225" r="38" fill="#e8f4ff"/>
    <text x="853" y="239" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900" font-style="italic" fill="#0877d1">P</text>
    <text x="845" y="297" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#17130a">PayPal</text>
    <text x="845" y="327" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#716958">International checkout</text>
  </g>

  <rect x="70" y="380" width="1060" height="2" fill="#d9b13d" opacity=".45"/>
  <text x="600" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#69551a">WORLD TV • MOBILE MONEY • CARD • PAYPAL</text>
</svg>
